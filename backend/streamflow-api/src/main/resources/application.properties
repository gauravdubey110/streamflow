spring.application.name=streamflow-api
server.port=8080

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=api-gateway-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.streamflow.common.dto

# StreamFlow topic names (overridable via env)
streamflow.kafka.topics.metrics-aggregated=metrics-aggregated
# SPEC-14: alert and circuit-breaker WebSocket push topics
streamflow.kafka.topics.alerts=alerts
streamflow.kafka.topics.cb-events=cb-events

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cassandra — enabled for SPEC-18 historical reads.
# SPEC-18 R6: Spring Data Cassandra configured here; read-only repos use prepared statements.
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=streamflow
spring.cassandra.schema-action=none

# SPEC-18 R3: maximum historical query window (configurable; default 24h)
streamflow.history.max-range-hours=24

# CORS — allowed origins for REST and WebSocket (SPEC-06 R5)
cors.allowed-origins=http://localhost:5173

# Chaos injection — producer base URL (SPEC-13 R5); override with STREAMFLOW_PRODUCER_BASE_URL env var
streamflow.producer.base-url=${STREAMFLOW_PRODUCER_BASE_URL:http://localhost:8081}

# Actuator — SPEC-20 R2
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# SPEC-20 R5: expose git + build info via /actuator/info
management.info.git.mode=simple
management.info.build.enabled=true
# SPEC-20 NFR2: global application tag for all metrics
management.metrics.tags.application=streamflow-api

# SpringDoc OpenAPI (SPEC-06 DoD)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
