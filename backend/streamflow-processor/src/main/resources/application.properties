spring.application.name=streamflow-processor
server.port=8082

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=stream-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.streamflow.common.dto
spring.kafka.listener.ack-mode=manual_immediate

# StreamFlow topic names (overridable via env)
streamflow.kafka.topics.viewer-events=viewer-events
streamflow.kafka.topics.stream-health=stream-health

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cassandra (SPEC-17 will add keyspace + schema init)
# Disabled by default until SPEC-17 — prevents startup failure when Cassandra is not running.
# Set CASSANDRA_ENABLED=true to re-enable Cassandra auto-configuration.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=streamflow
spring.cassandra.schema-action=none

# Alert engine thresholds (SPEC-11)
streamflow.alerts.high-buffer.warning-threshold=5.0
streamflow.alerts.high-buffer.critical-threshold=10.0
streamflow.alerts.viewer-drop.window-seconds=30
streamflow.alerts.viewer-drop.drop-threshold-pct=10.0
streamflow.alerts.bitrate.min-kbps=2500
streamflow.alerts.cooldown-seconds=60

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
