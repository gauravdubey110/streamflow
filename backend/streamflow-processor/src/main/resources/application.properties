spring.application.name=streamflow-processor
server.port=8082

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=stream-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.streamflow.common.dto
spring.kafka.listener.ack-mode=manual_immediate

# StreamFlow topic names (overridable via env)
streamflow.kafka.topics.viewer-events=viewer-events
streamflow.kafka.topics.stream-health=stream-health
streamflow.kafka.topics.alerts=alerts
# SPEC-14: cb-events topic — circuit-breaker state transitions published to API gateway
streamflow.kafka.topics.cb-events=cb-events

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cassandra (SPEC-17)
# Auto-configuration is now active. Schema is managed by infra/cassandra/init.cql
# (applied by the one-shot cassandra-init container in docker-compose.dev.yml).
# spring.cassandra.schema-action=none — schema is pre-created; Spring must not try to
# auto-create or validate tables (avoids startup failures when Cassandra is unavailable).
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=streamflow
spring.cassandra.schema-action=none

# Alert engine thresholds (SPEC-11)
streamflow.alerts.high-buffer.warning-threshold=5.0
streamflow.alerts.high-buffer.critical-threshold=10.0
streamflow.alerts.viewer-drop.window-seconds=30
streamflow.alerts.viewer-drop.drop-threshold-pct=10.0
streamflow.alerts.bitrate.min-kbps=2500
streamflow.alerts.cooldown-seconds=60

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Expose circuit-breaker health indicator (SPEC-12 AC4)
management.health.circuitbreakers.enabled=true

# Resilience4j circuit breaker — alertProcessor (SPEC-12 R2)
# Sliding window is COUNT_BASED with 20 calls; CB opens when >= 50% fail
# across the last 20 calls, provided at least 10 calls have been recorded.
# After OPEN for 30 s the CB moves to HALF_OPEN; 3 probe calls decide CLOSED vs OPEN.
resilience4j.circuitbreaker.instances.alertProcessor.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.alertProcessor.sliding-window-size=20
resilience4j.circuitbreaker.instances.alertProcessor.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.alertProcessor.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertProcessor.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.alertProcessor.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.alertProcessor.register-health-indicator=true
resilience4j.circuitbreaker.instances.alertProcessor.allow-health-indicator-to-fail=false
