# ─────────────────────────────────────────────────────────────────────────────
# Test-profile application.properties for streamflow-processor
#
# Overrides the main application.properties for all tests that use
# @SpringBootTest without an explicit Cassandra container.
#
# SPEC-17: Cassandra auto-configuration is excluded here so that existing
# integration tests (ViewerEventConsumerIT, StreamHealthConsumerIT) continue to
# run without a Cassandra container. The new CassandraRepositoryIT starts its
# own CassandraContainer and overrides the exclusion via @DynamicPropertySource.
# ─────────────────────────────────────────────────────────────────────────────

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration

# Cassandra contact-points still defined to avoid binding errors in CassandraConfig
# (the config will not be loaded when auto-config is excluded, but just in case)
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=streamflow
spring.cassandra.schema-action=none
