version: "3.9"

# ─────────────────────────────────────────────────────────────────────
# StreamFlow — Dev infrastructure only (Kafka + Redis)
# Cassandra is added in SPEC-17.
#
# Usage:
#   docker compose -f infra/docker-compose.dev.yml up -d
#   ./infra/kafka/init-topics.sh
# ─────────────────────────────────────────────────────────────────────

networks:
  streamflow-net:
    driver: bridge

services:

  # ── Zookeeper ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: streamflow-zookeeper
    networks:
      - streamflow-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # bash built-in TCP check — avoids nc dependency in the container
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Kafka (single broker) ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streamflow-kafka
    networks:
      - streamflow-net
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # PLAINTEXT_HOST is the listener reachable from the Docker host (localhost:9092).
      # PLAINTEXT is the listener used for inter-broker and container-to-container traffic.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Lower log retention for dev (saves disk space)
      KAFKA_LOG_RETENTION_HOURS: 2
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: streamflow-redis
    networks:
      - streamflow-net
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Cassandra (single node) ───────────────────────────────────────
  # SPEC-17: added for time-series persistence and historical replay.
  cassandra:
    image: cassandra:4.1
    container_name: streamflow-cassandra
    networks:
      - streamflow-net
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: streamflow-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    healthcheck:
      # cqlsh exits 0 when Cassandra is fully ready to accept queries
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── Cassandra schema init (one-shot) ──────────────────────────────
  # SPEC-17: runs once after Cassandra is healthy; exits 0 when done.
  # The service depends on the cassandra healthcheck passing so that
  # cqlsh can connect immediately without manual sleep loops.
  cassandra-init:
    image: cassandra:4.1
    container_name: streamflow-cassandra-init
    networks:
      - streamflow-net
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    # -u cassandra:cassandra are the default credentials for the plain authenticator.
    # If the default authenticator is AllowAllAuthenticator (the default) these flags
    # are harmless.  --request-timeout 30 prevents the client from hanging.
    command: >
      cqlsh cassandra 9042
        --request-timeout=30
        -f /init.cql
    restart: "no"

  # ── Prometheus ────────────────────────────────────────────────────
  # SPEC-20 R4: scrapes /actuator/prometheus from all 3 backend services
  # every 10 s (SPEC-20 NFR2). The config file is mounted read-only.
  # On host, Prometheus UI is available at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: streamflow-prometheus
    networks:
      - streamflow-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Grafana ───────────────────────────────────────────────────────
  # SPEC-20 R4: pre-provisioned with the Prometheus datasource and
  # the StreamFlow dashboard JSON (infra/grafana/dashboards/streamflow.json).
  # Default credentials: admin / admin (change on first login).
  # On host, Grafana UI is available at http://localhost:3001.
  grafana:
    image: grafana/grafana:10.4.2
    container_name: streamflow-grafana
    networks:
      - streamflow-net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
