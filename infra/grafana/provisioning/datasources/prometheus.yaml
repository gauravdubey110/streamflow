# SPEC-20 R4: Auto-provision Prometheus as the default datasource.
# Grafana reads this file on startup. No manual datasource setup required.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "10s"
