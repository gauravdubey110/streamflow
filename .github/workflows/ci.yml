name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (skip tests — no business logic yet)
        run: mvn -B -f backend/pom.xml verify -DskipTests

  # Frontend job added in SPEC-07 when the React app exists.
