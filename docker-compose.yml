version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# StreamFlow — Full-stack Docker Compose
# SPEC-21 R1: Single-command startup for the entire platform.
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs (uses cached images)
#   docker compose down -v             # teardown + remove volumes
#
# Dashboard: http://localhost:3000
# API:       http://localhost:8080
# Grafana:   http://localhost:3001  (admin / admin)
# Prometheus: http://localhost:9090
# ─────────────────────────────────────────────────────────────────────────────

networks:
  streamflow-net:
    driver: bridge

# Named volumes for data persistence across restarts
volumes:
  cassandra-data:
  redis-data:

services:

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: streamflow-zookeeper
    networks:
      - streamflow-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Kafka (single broker) ─────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streamflow-kafka
    networks:
      - streamflow-net
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # PLAINTEXT: intra-cluster / container-to-container traffic on port 29092
      # PLAINTEXT_HOST: exposed to Docker host on port 9092 (optional, for debugging)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 2
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Kafka topic init (one-shot) ────────────────────────────────────────────
  # Creates all required topics once Kafka is healthy; exits 0 when done.
  # SPEC-21 R1: replaces the manual init-topics.sh step in the full-stack compose.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streamflow-kafka-init
    networks:
      - streamflow-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating StreamFlow Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic viewer-events --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic stream-health --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic alerts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic metrics-aggregated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic cb-events --partitions 3 --replication-factor 1
        echo "Topics created:"
        kafka-topics --bootstrap-server kafka:29092 --list
        echo "kafka-init done."
    restart: "no"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: streamflow-redis
    networks:
      - streamflow-net
    volumes:
      - redis-data:/data
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Cassandra (single node) ───────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: streamflow-cassandra
    networks:
      - streamflow-net
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: streamflow-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── Cassandra schema init (one-shot) ──────────────────────────────────────
  cassandra-init:
    image: cassandra:4.1
    container_name: streamflow-cassandra-init
    networks:
      - streamflow-net
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    command: >
      cqlsh cassandra 9042
        --request-timeout=30
        -f /init.cql
    restart: "no"

  # ── Prometheus ────────────────────────────────────────────────────────────
  # SPEC-21 R1 + SPEC-20 R4: scrapes all 3 backend services by container name.
  # Uses infra/prometheus/prometheus-compose.yml (service-name targets).
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: streamflow-prometheus
    networks:
      - streamflow-net
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
      - processor
      - producer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: streamflow-grafana
    networks:
      - streamflow-net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── streamflow-producer ───────────────────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: backend/streamflow-producer/Dockerfile
    image: streamflow-producer:latest
    container_name: streamflow-producer
    networks:
      - streamflow-net
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STREAMFLOW_SIMULATION_ENABLED: "true"
      STREAMFLOW_SIMULATION_TPS: "1000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    restart: on-failure

  # ── streamflow-processor ──────────────────────────────────────────────────
  processor:
    build:
      context: .
      dockerfile: backend/streamflow-processor/Dockerfile
    image: streamflow-processor:latest
    container_name: streamflow-processor
    networks:
      - streamflow-net
    ports:
      - "8082:8082"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_DATACENTER: datacenter1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: on-failure

  # ── streamflow-api ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/streamflow-api/Dockerfile
    image: streamflow-api:latest
    container_name: streamflow-api
    networks:
      - streamflow-net
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: "9042"
      STREAMFLOW_PRODUCER_BASE_URL: http://producer:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: on-failure

  # ── Frontend (Nginx) ──────────────────────────────────────────────────────
  # SPEC-21 R3: Vite build → nginx:alpine; proxies /api and /ws to api service.
  # Exposed on host port 3000.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: streamflow-frontend:latest
    container_name: streamflow-frontend
    networks:
      - streamflow-net
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
