# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — StreamFlow frontend reverse proxy
# SPEC-21 R3: serves the Vite-built SPA; proxies /api and /ws to api service.
#
# In the full-stack Docker Compose network the API gateway is reachable at
# http://api:8080.  In dev (npm run dev) Vite's own dev-server proxy handles
# /api and /ws (see vite.config.ts).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Static SPA assets ────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # All routes fall back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── REST API proxy ───────────────────────────────────────────────────
    # Forward /api/* to the api gateway service inside the Docker network.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket (STOMP/SockJS) proxy ───────────────────────────────────
    # SockJS first attempts a plain WebSocket upgrade; Nginx must forward
    # the Upgrade and Connection headers to enable the protocol switch.
    location /ws {
        proxy_pass             http://api:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout     86400s;  # keep WS connections alive
        proxy_send_timeout     86400s;
    }

    # ── Actuator pass-through (optional; useful for smoke tests) ─────────
    location /actuator/ {
        proxy_pass         http://api:8080/actuator/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
}
