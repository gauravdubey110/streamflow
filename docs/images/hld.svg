<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 770" width="1360" height="770" role="img" aria-label="StreamFlow high-level design: the producer publishes keyed events to Kafka, the processor aggregates them in Redis, persists one row per minute to Cassandra and publishes snapshots and alerts back to Kafka, the API consumes those topics and pushes them to the React dashboard over STOMP, and chaos requests travel the other way from the dashboard through the API to the producer.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#374151"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="770" rx="12" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1f2937">

    <!-- ===== Kafka band ===== -->
    <rect x="40" y="230" width="980" height="105" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="58" y="251" font-size="13" font-weight="700" fill="#c2410c">Kafka</text>
    <line x1="505" y1="244" x2="505" y2="322" stroke="#c2410c" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="440" y="251" font-size="11" text-anchor="end" fill="#9a3412">inbound</text>
    <text x="520" y="251" font-size="11" fill="#9a3412">outbound</text>

    <rect x="60" y="270" width="190" height="48" rx="6" fill="#ffedd5" stroke="#c2410c"/>
    <text x="155" y="291" font-size="13" font-weight="600" text-anchor="middle">viewer-events</text>
    <text x="155" y="307" font-size="11" text-anchor="middle" fill="#6b7280">6 partitions</text>

    <rect x="265" y="270" width="190" height="48" rx="6" fill="#ffedd5" stroke="#c2410c"/>
    <text x="360" y="291" font-size="13" font-weight="600" text-anchor="middle">stream-health</text>
    <text x="360" y="307" font-size="11" text-anchor="middle" fill="#6b7280">3 partitions</text>

    <rect x="540" y="270" width="460" height="48" rx="6" fill="#ffedd5" stroke="#c2410c"/>
    <text x="770" y="291" font-size="13" font-weight="600" text-anchor="middle">metrics-aggregated · alerts · cb-events</text>
    <text x="770" y="307" font-size="11" text-anchor="middle" fill="#6b7280">3 partitions each</text>

    <!-- ===== Producer ===== -->
    <rect x="40" y="40" width="440" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="60" y="66" font-size="15" font-weight="700">Producer <tspan font-weight="400" fill="#6b7280">:8081</tspan></text>
    <text x="60" y="87" font-size="12">simulates viewer events + encoder health (500 events/s)</text>
    <text x="60" y="105" font-size="12">chaos: VIEWER_DROP · HIGH_BUFFER · BITRATE_SPIKE · STREAM_DOWN</text>

    <!-- ===== Frontend ===== -->
    <rect x="1060" y="40" width="260" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="1080" y="66" font-size="15" font-weight="700">React dashboard <tspan font-weight="400" fill="#6b7280">:3000</tspan></text>
    <text x="1080" y="87" font-size="12">live charts · health gauge · alert feed</text>
    <text x="1080" y="105" font-size="12">chaos controls · history replay</text>

    <!-- ===== Processor ===== -->
    <rect x="40" y="400" width="340" height="260" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="60" y="426" font-size="15" font-weight="700">Processor <tspan font-weight="400" fill="#6b7280">:8082</tspan></text>
    <text x="60" y="450" font-size="12">• Kafka consumers (manual ack, retry + DLT)</text>
    <text x="60" y="470" font-size="12">• sliding-window aggregation</text>
    <text x="60" y="490" font-size="12">• alert engine (buffer, bitrate, viewer-drop)</text>
    <text x="60" y="510" font-size="12">• Resilience4j circuit breaker on alerts</text>
    <text x="60" y="530" font-size="12">• SnapshotPublisher, every 1 s per stream</text>

    <!-- ===== Redis / Cassandra ===== -->
    <rect x="520" y="470" width="200" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="540" y="496" font-size="15" font-weight="700">Redis</text>
    <text x="540" y="516" font-size="12">live state, source of truth</text>
    <text x="540" y="534" font-size="12">stream_snapshot (30 s TTL)</text>

    <rect x="520" y="580" width="200" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="540" y="606" font-size="15" font-weight="700">Cassandra</text>
    <text x="540" y="626" font-size="12">history for replay</text>
    <text x="540" y="644" font-size="12">1 row / min / stream</text>

    <!-- ===== API ===== -->
    <rect x="860" y="400" width="460" height="260" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="880" y="426" font-size="15" font-weight="700">API gateway <tspan font-weight="400" fill="#6b7280">:8080</tspan></text>
    <text x="880" y="450" font-size="12">• Kafka consumers → STOMP /topic/**</text>
    <text x="880" y="470" font-size="12">• REST /api/v1: streams, history, alerts</text>
    <text x="880" y="490" font-size="12">• ETag + range limit on history</text>
    <text x="880" y="510" font-size="12">• chaos proxy → producer</text>

    <!-- ===== Observability strip ===== -->
    <rect x="40" y="700" width="1160" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5 4"/>
    <text x="60" y="722" font-size="13" font-weight="700">Prometheus <tspan font-weight="400" fill="#6b7280">:9090</tspan>  →  Grafana <tspan font-weight="400" fill="#6b7280">:3001</tspan></text>
    <text x="60" y="740" font-size="12">scrapes /actuator/prometheus every 10 s from producer, processor and API: events published/consumed, alerts fired, circuit-breaker state, snapshot duration</text>

    <!-- ===== Arrows (data plane) ===== -->
    <g stroke="#374151" stroke-width="1.8" fill="none">
      <!-- producer -> kafka -->
      <line x1="155" y1="130" x2="155" y2="269" marker-end="url(#ar)"/>
      <line x1="360" y1="130" x2="360" y2="269" marker-end="url(#ar)"/>
      <!-- kafka -> processor -->
      <line x1="155" y1="319" x2="155" y2="399" marker-end="url(#ar)"/>
      <line x1="360" y1="319" x2="360" y2="399" marker-end="url(#ar)"/>
      <!-- processor -> kafka outbound -->
      <polyline points="380,440 600,440 600,320" marker-end="url(#ar)"/>
      <!-- processor <-> redis -->
      <line x1="381" y1="520" x2="519" y2="520" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <!-- processor -> cassandra -->
      <line x1="381" y1="620" x2="519" y2="620" marker-end="url(#ar)"/>
      <!-- kafka outbound -> api -->
      <line x1="930" y1="336" x2="930" y2="399" marker-end="url(#ar)"/>
      <!-- api -> redis, api -> cassandra -->
      <line x1="859" y1="520" x2="721" y2="520" marker-end="url(#ar)"/>
      <line x1="859" y1="620" x2="721" y2="620" marker-end="url(#ar)"/>
      <!-- api -> frontend (push), frontend -> api (rest) -->
      <line x1="1110" y1="399" x2="1110" y2="131" marker-end="url(#ar)"/>
      <line x1="1250" y1="131" x2="1250" y2="399" marker-end="url(#ar)"/>
    </g>

    <!-- ===== Arrow labels ===== -->
    <g font-size="11" fill="#374151">
      <text x="170" y="180">publish</text>
      <text x="170" y="194">key = streamId</text>

      <text x="170" y="362">consume, manual ack</text>

      <text x="392" y="414">publish snapshots 1/s,</text>
      <text x="392" y="428">alerts, CB events</text>

      <text x="450" y="500" text-anchor="middle">write per event,</text>
      <text x="450" y="513" text-anchor="middle">read 1×/s</text>

      <text x="450" y="596" text-anchor="middle">persist 1/min/stream</text>
      <text x="450" y="609" text-anchor="middle">(async, drop on backlog)</text>

      <text x="942" y="372">consume</text>

      <text x="790" y="500" text-anchor="middle">GET live snapshot</text>
      <text x="790" y="600" text-anchor="middle">history queries</text>

      <text x="1120" y="260">STOMP push</text>
      <text x="1120" y="274">/topic/** (1 s)</text>
      <text x="1260" y="260">REST /api/v1</text>
      <text x="1260" y="274">+ chaos POST</text>
    </g>

    <!-- ===== Control plane: chaos ===== -->
    <polyline points="1040,399 1040,95 481,95" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arc)"/>
    <text x="760" y="85" font-size="11" text-anchor="middle" fill="#6d28d9">control path: chaos start / cancel, proxied by the API to POST /internal/chaos</text>
  </g>
</svg>
